name: Auto Fix Imports & Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Remove unused imports & format
        run: ./gradlew spotlessApply

      - name: Fix dependency declarations
        run: ./gradlew fixDependencies --upgrade

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b autofix/deps-${{ github.run_id }}
          git add .
          git commit -m "chore: auto-fix imports & dependencies"
          git push origin HEAD

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Automated dependency & import cleanup"
          body: |
            This PR was generated automatically.
            
            - Removed unused imports (Spotless / ktlint)
            - Fixed dependency declarations (Dependency Analysis Plugin)
          branch: autofix/deps-${{ github.run_id }}
          base: main
